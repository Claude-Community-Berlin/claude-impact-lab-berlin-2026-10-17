# Turns a "Team submission" issue into submissions/<team>.md and opens a PR that closes the issue.
# Editing the issue updates the same PR.
name: Submission issue → PR

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: submission-${{ github.event.issue.number }}

jobs:
  create-pr:
    # Only run in the event repo, not in team repos created from this template.
    if: >-
      github.repository == 'Claude-Community-Berlin/claude-impact-lab-berlin-2026-10-17' &&
      contains(github.event.issue.labels.*.name, 'submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;

            // Issue forms render as "### Label\n\nvalue" blocks.
            const fields = {};
            for (const part of (issue.body || '').split(/^### /m).slice(1)) {
              const nl = part.indexOf('\n');
              const value = part.slice(nl + 1).trim();
              fields[part.slice(0, nl).trim()] = value === '_No response_' ? '' : value;
            }
            const get = (label) => fields[label] || '';
            const clean = (s) => s.replace(/\r?\n+/g, ' ').trim();

            const team = clean(get('Team name'));
            const slug = team.toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '')
              .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 50);
            if (!slug) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                body: '⚠️ Could not read a team name. Please edit the issue and fill in **Team name**.' });
              core.setFailed('Missing team name');
              return;
            }

            const members = get('Team').split('\n')
              .map((l) => l.replace(/^[-*]\s*/, '').trim()).filter(Boolean)
              .map((l) => {
                const [name, ...role] = l.split(/\s*[|–—]\s*|\s+-\s+/);
                return `| ${name} | ${role.join(', ')} |`;
              });

            const path = `submissions/${slug}.md`;
            const content = [
              `# Team name: ${team}`,
              '',
              `**One-line pitch:** ${clean(get('One-line pitch'))}`,
              '',
              `**Theme / problem:** ${clean(get('Theme / problem'))}`,
              '',
              `**Repo:** ${clean(get('Repo'))}`,
              '',
              `**Demo video (optional, max 2 min):** ${clean(get('Demo video (optional, max 2 min)'))}`,
              '',
              `**Live link / screenshots (optional):** ${clean(get('Live link / screenshots (optional)'))}`,
              '',
              '## Team',
              '| Name | Role / background |',
              '|---|---|',
              ...members,
              '',
              '## How Claude is used',
              get('How Claude is used'),
              '',
              "## What's next",
              get("What's next"),
              '',
              `<!-- Generated from issue #${issue.number} -->`,
              '',
            ].join('\n');

            // Branch per issue, created from the default branch.
            const branch = `submission/issue-${issue.number}`;
            const base = context.payload.repository.default_branch;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            } catch (e) {
              if (e.status !== 404) throw e;
              const { data: baseRef } = await github.rest.git.getRef({ owner, repo, ref: `heads/${base}` });
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: baseRef.object.sha });
            }

            // If the team was renamed, remove the old file from this branch.
            const { data: dir } = await github.rest.repos.getContent({ owner, repo, path: 'submissions', ref: branch });
            const { data: baseDir } = await github.rest.repos.getContent({ owner, repo, path: 'submissions', ref: base });
            const baseFiles = new Set(baseDir.map((f) => f.path));
            for (const f of dir) {
              if (f.path !== path && !baseFiles.has(f.path)) {
                await github.rest.repos.deleteFile({ owner, repo, path: f.path, branch, sha: f.sha,
                  message: `Remove old submission file ${f.name} (#${issue.number})` });
              }
            }

            const existing = dir.find((f) => f.path === path);
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: `${existing ? 'Update' : 'Add'} submission: ${team} (#${issue.number})`,
              content: Buffer.from(content).toString('base64'),
              sha: existing?.sha,
            });

            const { data: prs } = await github.rest.pulls.list({ owner, repo, head: `${owner}:${branch}`, state: 'open' });
            if (prs.length) {
              core.info(`Updated existing PR #${prs[0].number}`);
              return;
            }
            const { data: pr } = await github.rest.pulls.create({
              owner, repo, head: branch, base,
              title: `Submission: ${team}`,
              body: `Adds \`${path}\` from issue #${issue.number} by @${issue.user.login}.\n\nCloses #${issue.number}`,
            });
            await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
              body: `✅ Thanks! Your submission PR is #${pr.number}. Edit this issue to update it.` });
